<svg viewBox="0 0 860 440" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <!-- ONE decode step, animated in 4 phases (12s loop, SMIL discrete):
       (1) the new token's q,k,v are projected;
       (2) q interrogates EVERY cached key (score arrows light up);
       (3) the weighted values flow into the output;
       (4) q fades out — used once, DISCARDED — while k,v join the cache and the
           greyed-out past queries stay dead: nobody will ever ask them anything.
       Static frame (t=0) already shows the full wiring, so it reads without animation. -->
  <style>
    .title { font-size: 15px; font-weight: bold; fill: #4A5B6E; }
    .lab   { font-size: 12px; fill: #4A5B6E; }
    .big   { font-size: 13px; font-weight: bold; }
    .mono  { font-size: 11px; font-family: monospace; }
    .green { fill: #2E7A5A; }
    .blue  { fill: #3A6B96; }
    .amber { fill: #7A6528; }
    .red   { fill: #8B3B4A; }
  </style>

  <text x="430" y="26" text-anchor="middle" class="title">One decode step: who talks to whom</text>

  <!-- cached K row -->
  <text x="60" y="120" class="lab" font-weight="bold">cached K</text>
  <g class="mono" text-anchor="middle" fill="#fff">
    <rect x="150" y="100" width="70" height="30" rx="4" class="blue"/><text x="185" y="120">K0</text>
    <rect x="230" y="100" width="70" height="30" rx="4" class="blue"/><text x="265" y="120">K1</text>
    <rect x="310" y="100" width="70" height="30" rx="4" class="blue"/><text x="345" y="120">K2</text>
    <rect x="390" y="100" width="70" height="30" rx="4" class="blue"/><text x="425" y="120">K3</text>
  </g>
  <!-- cached V row -->
  <text x="60" y="185" class="lab" font-weight="bold">cached V</text>
  <g class="mono" text-anchor="middle" fill="#fff">
    <rect x="150" y="165" width="70" height="30" rx="4" class="blue"/><text x="185" y="185">V0</text>
    <rect x="230" y="165" width="70" height="30" rx="4" class="blue"/><text x="265" y="185">V1</text>
    <rect x="310" y="165" width="70" height="30" rx="4" class="blue"/><text x="345" y="185">V2</text>
    <rect x="390" y="165" width="70" height="30" rx="4" class="blue"/><text x="425" y="185">V3</text>
  </g>
  <text x="500" y="120" class="lab">← read by EVERY future step → <tspan font-weight="bold">worth storing</tspan></text>
  <text x="500" y="185" class="lab">← read by EVERY future step → <tspan font-weight="bold">worth storing</tspan></text>

  <!-- dead past queries -->
  <text x="60" y="260" class="lab" font-weight="bold">past q&#8217;s</text>
  <g class="mono" text-anchor="middle">
    <g opacity="0.35">
      <rect x="150" y="240" width="70" height="30" rx="4" fill="none" stroke="#7d8b9a" stroke-dasharray="5 3"/><text x="185" y="260" fill="#7d8b9a">q0</text>
      <rect x="230" y="240" width="70" height="30" rx="4" fill="none" stroke="#7d8b9a" stroke-dasharray="5 3"/><text x="265" y="260" fill="#7d8b9a">q1</text>
      <rect x="310" y="240" width="70" height="30" rx="4" fill="none" stroke="#7d8b9a" stroke-dasharray="5 3"/><text x="345" y="260" fill="#7d8b9a">q2</text>
      <rect x="390" y="240" width="70" height="30" rx="4" fill="none" stroke="#7d8b9a" stroke-dasharray="5 3"/><text x="425" y="260" fill="#7d8b9a">q3</text>
    </g>
    <line x1="145" y1="255" x2="465" y2="255" stroke="#8B3B4A" stroke-width="1.6"/>
  </g>
  <text x="500" y="260" class="lab red" font-weight="bold">already spoke — never asked again → not stored</text>

  <!-- the new token: q, k, v -->
  <g class="mono" text-anchor="middle" fill="#fff">
    <rect x="150" y="330" width="70" height="30" rx="4" class="green">
      <animate attributeName="opacity" values="1;1;1;0.15;1" keyTimes="0;0.25;0.5;0.75;0.999" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="185" y="350">q new<animate attributeName="opacity" values="1;1;1;0.15;1" keyTimes="0;0.25;0.5;0.75;0.999" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
    <rect x="230" y="330" width="70" height="30" rx="4" class="amber"/><text x="265" y="350">k new</text>
    <rect x="310" y="330" width="70" height="30" rx="4" class="amber"/><text x="345" y="350">v new</text>
  </g>
  <text x="60" y="350" class="lab" font-weight="bold">new token</text>

  <!-- phase 2: q -> every K (score arrows) -->
  <g stroke="#2E7A5A" stroke-width="1.8" fill="none" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.9;0.35;0.1;0.9" keyTimes="0;0.25;0.5;0.75;0.999" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <path d="M 178 330 C 165 240, 170 170, 182 134"/>
    <path d="M 192 330 C 210 250, 245 180, 262 134"/>
    <path d="M 200 330 C 250 260, 320 180, 342 134"/>
    <path d="M 206 332 C 300 270, 400 180, 422 134"/>
  </g>
  <text x="118" y="308" class="big green">q·K<tspan font-size="10" baseline-shift="super">T</tspan>
    <animate attributeName="opacity" values="1;1;0.3;0.1;1" keyTimes="0;0.25;0.5;0.75;0.999" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- phase 3: weighted V -> output -->
  <g stroke="#3A6B96" stroke-width="1.8" fill="none" opacity="0.25">
    <animate attributeName="opacity" values="0.25;0.25;0.9;0.25;0.25" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
    <path d="M 222 180 C 400 200, 600 230, 700 305"/>
    <path d="M 302 180 C 450 210, 610 240, 702 308"/>
    <path d="M 382 180 C 500 220, 620 250, 704 311"/>
    <path d="M 462 182 C 560 230, 640 260, 707 314"/>
  </g>
  <g class="mono" text-anchor="middle" fill="#fff">
    <rect x="660" y="330" width="110" height="30" rx="4" class="blue"/>
    <text x="715" y="350">output = Σ wᵢVᵢ</text>
  </g>
  <text x="770" y="308" text-anchor="end" class="big blue">softmax(scores) weighs the V&#8217;s
    <animate attributeName="opacity" values="0.35;0.35;1;0.35;0.35" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- phase 4 captions: q discarded, k/v appended -->
  <text x="150" y="395" text-anchor="middle" class="big red" opacity="0.4">used ONCE → discarded
    <animate attributeName="opacity" values="0.4;0.4;0.4;1;0.4" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="380" y="395" text-anchor="middle" class="big amber" opacity="0.4">↑ appended to the cache
    <animate attributeName="opacity" values="0.4;0.4;0.4;1;0.4" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="430" y="428" text-anchor="middle" class="lab"><tspan font-weight="bold">the rule:</tspan> Q is per-step and disposable · K and V are per-token and re-read on every future step — so cache K and V, never Q</text>
</svg>
