<svg viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Verdana, sans-serif">
  <!-- Animated running-tab intuition (12s loop, 4 rounds, SMIL discrete).
       Left: no tab — every round the bartender re-adds EVERY receipt (whole pile
       flashes red, re-added counter climbs 1,3,6,10). Right: the tab — one line
       appears per round, the total just updates. Bottom row maps the metaphor to
       the KV cache. Round 1 visible at t=0 so the first frame is never empty. -->
  <style>
    .title { font-size: 15px; font-weight: bold; fill: #4A5B6E; }
    .lab   { font-size: 12px; fill: #4A5B6E; }
    .big   { font-size: 13px; font-weight: bold; }
    .mono  { font-size: 12px; font-family: monospace; }
    .red   { fill: #8B3B4A; }
    .green { fill: #2E7A5A; }
    .slate { fill: #4A5B6E; }
    .amber { fill: #7A6528; }
  </style>

  <text x="215" y="26" text-anchor="middle" class="title">No tab</text>
  <text x="215" y="44" text-anchor="middle" class="lab">every round, re-add EVERY receipt from the pile</text>
  <text x="645" y="26" text-anchor="middle" class="title">Running tab (= the KV cache)</text>
  <text x="645" y="44" text-anchor="middle" class="lab">the total is written down — just add the new line</text>

  <!-- LEFT: receipt pile; each round the WHOLE visible pile flashes red (re-added) -->
  <!-- receipts (rounds 1-4), base row y stacked upward -->
  <g>
    <g>
      <rect x="115" y="256" width="200" height="34" rx="4" fill="#e8e2d4" stroke="#b8ae98"/>
      <text x="130" y="278" class="mono" fill="#4A5B6E">round 1 · ale ......... 7</text>
      <rect x="115" y="256" width="200" height="34" rx="4" class="red" opacity="0">
        <animate attributeName="opacity" values="0.55;0;0.55;0;0.55;0;0.55;0" keyTimes="0;0.08;0.25;0.33;0.5;0.58;0.75;0.83" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.25;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      <rect x="115" y="216" width="200" height="34" rx="4" fill="#e8e2d4" stroke="#b8ae98"/>
      <text x="130" y="238" class="mono" fill="#4A5B6E">round 2 · mead ........ 9</text>
      <rect x="115" y="216" width="200" height="34" rx="4" class="red" opacity="0">
        <animate attributeName="opacity" values="0;0;0.55;0;0.55;0;0.55;0" keyTimes="0;0.25;0.26;0.33;0.5;0.58;0.75;0.83" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      <rect x="115" y="176" width="200" height="34" rx="4" fill="#e8e2d4" stroke="#b8ae98"/>
      <text x="130" y="198" class="mono" fill="#4A5B6E">round 3 · cider ....... 6</text>
      <rect x="115" y="176" width="200" height="34" rx="4" class="red" opacity="0">
        <animate attributeName="opacity" values="0;0;0.55;0;0.55;0" keyTimes="0;0.5;0.51;0.58;0.75;0.83" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      <rect x="115" y="136" width="200" height="34" rx="4" fill="#e8e2d4" stroke="#b8ae98"/>
      <text x="130" y="158" class="mono" fill="#4A5B6E">round 4 · stout ....... 8</text>
      <rect x="115" y="136" width="200" height="34" rx="4" class="red" opacity="0">
        <animate attributeName="opacity" values="0;0;0.55;0" keyTimes="0;0.75;0.76;0.83" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <text x="215" y="316" text-anchor="middle" class="big red">receipts re-added so far:</text>
  <g class="big red" text-anchor="middle">
    <text x="215" y="336" opacity="1">1<animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;0.999" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
    <text x="215" y="336" opacity="0">1 + 2 = 3<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
    <text x="215" y="336" opacity="0">3 + 3 = 6<animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.25;0.5;0.75" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
    <text x="215" y="336" opacity="0">6 + 4 = 10 … O(n²)<animate attributeName="opacity" values="0;0;0;1" keyTimes="0;0.25;0.5;0.75" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  </g>

  <!-- RIGHT: the tab card — lines appear once, total updates -->
  <rect x="520" y="120" width="250" height="186" rx="8" fill="#f5f1e6" stroke="#b8ae98" stroke-width="1.4"/>
  <text x="545" y="144" class="mono" fill="#4A5B6E" font-weight="bold">TAB — table 7</text>
  <line x1="540" y1="152" x2="750" y2="152" stroke="#b8ae98"/>
  <g class="mono" fill="#4A5B6E">
    <text x="545" y="172">ale ............. 7</text>
    <text x="545" y="192" opacity="0">mead ............ 9<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.25;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
    <text x="545" y="212" opacity="0">cider ........... 6<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
    <text x="545" y="232" opacity="0">stout ........... 8<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  </g>
  <line x1="540" y1="272" x2="750" y2="272" stroke="#b8ae98"/>
  <g class="mono" font-weight="bold">
    <text x="545" y="292" class="green" opacity="1">total  7<animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;0.999" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
    <text x="545" y="292" class="green" opacity="0">total 16<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
    <text x="545" y="292" class="green" opacity="0">total 22<animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.25;0.5;0.75" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
    <text x="545" y="292" class="green" opacity="0">total 30<animate attributeName="opacity" values="0;0;0;1" keyTimes="0;0.25;0.5;0.75" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
  </g>
  <text x="645" y="336" text-anchor="middle" class="big green">work per round: write ONE line … O(n)</text>

  <!-- the mapping row -->
  <line x1="65" y1="356" x2="795" y2="356" stroke="#b8ae98" stroke-dasharray="4 3"/>
  <text x="430" y="376" text-anchor="middle" class="lab">
    <tspan font-weight="bold">the metaphor, mapped:</tspan> receipts = past tokens · re-adding = recomputing their K,V
  </text>
  <text x="430" y="394" text-anchor="middle" class="lab">the tab = the KV cache · the new line = the new token&#8217;s K,V</text>
</svg>
