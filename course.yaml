# course.yaml v1 - AI/ML Learning Resources.
# Charter: docs/plans/structure-rework/ai-ml-blueprints/ai-ml-blueprint-index.md
# section "Course declaration - AI-ML/AI-ML-study-notes/learning-resources/course.yaml"
# plus docs/plans/structure-rework/ai-ml-blueprints/ai-ml-learning-resources-structure.md.
#
# SCOPE (2026-08-04, T-86): seven of the charter's eight sections are declared here -
# foundations, core-machine-learning, deep-learning, modalities-and-generative-models,
# deployment-and-mlops and specialized-studies, alongside the
# llms-applications-and-agents section that landed earlier in the P2 agentic wave and is
# carried through unchanged. The twenty legacy ordinal folders ("00. Basics" ..
# "21. Frontier_and_Staying_Current") were restructured into the chartered kebab-case tree
# in the same change; every path below exists on disk.
#
# NOT DECLARED, deliberately:
#   - world-models-and-embodied-intelligence - the charter's eighth section has NO content
#     on disk. Authoring-contract Rule 3 ("restructure with the content that exists") and
#     the T-86 brief both forbid stubbing it, so it is reported as a gap, not fabricated.
#   - foundations/ai-paradigms-and-knowledge, deep-learning/sequence-modeling,
#     deep-learning/scientific-and-specialized-deep-learning,
#     specialized-studies/neuro-symbolic-and-structured-intelligence - chartered sub-areas
#     with no pages yet; they carry no enum entry because no page declares them.
#   - modalities-and-generative-models/{multimodal-learning,video-understanding,
#     audio-and-speech} - these hold a curated README only. The folder is real, the
#     category has no lesson, so nothing is declared and nothing is stubbed.
#   - nothing from the retired ordinal tree. The LLM wave (2026-08-04) re-homed the last
#     legacy folder: nineteen of its twenty topics now sit under the five chartered
#     llms-applications-and-agents sub-areas, and the FlashAttention topic moved to its
#     canonical home at deep-learning/attention-and-transformers/efficient-attention.
#   - every README.md, metadata.yaml, images/, code/, notebooks/ and tools/ folder, and
#     every *.references.md companion - teaching assets and repo-facing catalogues, not
#     lessons with a nav entry.
#
# GROUP_BY DEPTH - resolves the charter's recorded open question. The charter states the
# tree is two levels deep in most sections and three in core-machine-learning, and records
# both readings without choosing. Resolution taken here: where a section is three levels
# deep AND has real content, the MIDDLE folder becomes a `parent:`-nested section
# (cml-supervised-learning, cml-unsupervised-learning, cml-reinforcement-learning) and the
# LEAF folder is the `category`. Folder = URL = nav holds with no Rule 1 violation, and
# only schema vocabulary is used: `parent:` nests exactly one level and adds no URL
# segment, so a page still addresses
# core-machine-learning/supervised-learning/regression/linear-regression/linear-regression.
# The charter's alternative - dropping a level from the nav - was rejected because it
# leaves a folder the nav never shows, which Rule 1 forbids.
#
# ENUM BINDING - `categories` is therefore the LEAF grouping folder, which is the
# second-level sub-area in the two-level sections and the third-level sub-area in
# core-machine-learning. That differs from the charter's "49 second-level sub-area
# folders" sentence, which assumed the unresolved two-level reading.
#
# ROOT-FOLDER NAME - the module root is still `AI-ML-learning-resources/` (this repo's own
# name); the charter's target `learning-resources/` needs the shared WIRED_COURSES
# `moduleDir`/`moduleRoute` values changed, which this wave is not permitted to touch.
