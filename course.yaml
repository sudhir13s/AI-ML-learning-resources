# course.yaml — AI/ML Learning Resources, in the estate/v2 declaration envelope.
#
# Spec:    docs/plans/structure-rework/commons/declaration-schema.md
# Charter: docs/plans/structure-rework/ai-ml-blueprints/ai-ml-learning-resources-structure.md
# Declaration: docs/plans/structure-rework/ai-ml-blueprints/ai-ml-blueprint-index.md
#   section "Course declaration - AI-ML/AI-ML-study-notes/learning-resources/course.yaml".
# Validate from interview-prep-app/:
#   npx tsx scripts/validate-structure.ts --root <this module root>
#
# WHAT CHANGED IN THE CONVERSION, AND WHAT DID NOT
#
# Changed: the file's ENVELOPE and its SHAPE. `version: 1` + `module:` became
# `apiVersion` / `kind: Course` / `metadata` / `spec`; `enums:` and `sections:`
# moved under `spec:`; `chapters:` was renamed `pages:`; and the three sections
# that carried `parent: core-machine-learning` — Supervised Learning, Unsupervised
# Learning, Reinforcement Learning — are now written where they belong, inside
# their parent's `sections:`. `parent:` and `validateSectionParents()` are gone
# from the schema: nesting is expressed by nesting.
#
# Unchanged: every path, every id, every title, and the order they appear in.
# Flattening the recursion depth-first reproduces the v1 document's section order
# exactly, which is why this conversion is output-neutral — `course-manifests.json`
# is byte-identical and the `validateCourse` issue list is unchanged. That is the
# proof this PR carries. A declaration wave that alters one exported byte has done
# a content pass's work inside the declaration PR and must be split.
#
# THE `lr-<topic>` TOPIC PACKAGES — restored (T-246.7 part 2), and the one place
# this module's declaration is NOT output-neutral.
#
# The charter calls these packages "the tab's dominant shape, not an edge case".
# v1 could not express them: `parent:` nested exactly one level and this module had
# spent that level on the core-machine-learning middle folders above, so the eight
# multi-page topic packages under llms-applications-and-agents had nowhere to go
# and stayed a flat run of pages inside their section. They were dropped SILENTLY —
# no error, no warning, nothing to notice.
#
# Every folder with more than one page is now its own section, nested under
# llms-applications-and-agents, per authoring-contract Rule 3 ("a subject folder
# with more than one page is declared as its own section, parented to its
# category, so it renders as an ordered course rather than loose sibling pages").
# Eight packages, 19 pages, listed in the order they were already declared in:
#
#   lr-advanced-rag ................... 2   lr-vector-search .............. 2
#   lr-chunking ....................... 2   lr-coding-and-computer-use-agents  2
#   lr-embedding-models ............... 2   lr-kv-cache ................... 5
#   lr-rag-foundations ................ 2   lr-inference-optimization ..... 2
#
# WHAT THIS MOVES, AND WHAT IT DOES NOT. Sections go 10 -> 18. Chapters stay at
# 289: not one page is added, removed or re-pathed — the 19 pages MOVE from their
# section's flat run into the package that owns them, so llms-applications-and-agents
# goes 58 -> 39 and the eight new sections hold the difference. URLs do not move
# either: nesting changes the nav, never the address, so every page still addresses
# its full folder path. The `validateCourse` issue list is unchanged at 0/0.
#
# Each package declares `pages:` and not `root:`. The reading order is the order
# already declared, and adding `root:` beside `pages:` would make the folder
# declaration a second ordering source — the exact ambiguity Rule 4 exists to end.
#
# GROUP_BY DEPTH — the charter's recorded open question, resolved the same way the
# v1 document resolved it and carried through here unchanged. Where a section is
# three levels deep AND has real content, the MIDDLE folder is the nested section
# (Supervised / Unsupervised / Reinforcement Learning) and the LEAF folder is the
# `category`. Folder = URL = nav holds with no Rule 1 violation: nesting changes
# the nav, never the address, so a page still addresses
# core-machine-learning/supervised-learning/regression/linear-regression/linear-regression.
# The charter's alternative — dropping a level from the nav — was rejected because
# it leaves a folder the nav never shows, which Rule 1 forbids.
#
# ENUM BINDING — `categories` is therefore the LEAF grouping folder: the
# second-level sub-area in the two-level sections, the third-level sub-area in
# core-machine-learning. That differs from the charter's "49 second-level sub-area
# folders" sentence, which assumed the unresolved two-level reading.
#
# ROOT-FOLDER NAME — the module root is still `AI-ML-learning-resources/` (this
# repo's own name); the charter's target `learning-resources/` needs the shared
# WIRED_COURSES `moduleDir`/`moduleRoute` values changed, which a declaration PR
# is not permitted to touch.
#
# SCOPE — seven of the charter's eight sections are declared. NOT DECLARED,
# deliberately:
#   - world-models-and-embodied-intelligence — the charter's eighth section has NO
#     content on disk. Authoring-contract Rule 3 ("restructure with the content
#     that exists") forbids stubbing it, so it is reported as a gap, not fabricated.
#   - foundations/ai-paradigms-and-knowledge, deep-learning/sequence-modeling,
#     deep-learning/scientific-and-specialized-deep-learning,
#     specialized-studies/neuro-symbolic-and-structured-intelligence — chartered
#     sub-areas with no pages yet; they carry no enum entry because no page
#     declares them.
#   - modalities-and-generative-models/{multimodal-learning,video-understanding,
#     audio-and-speech} — these hold a curated README only. The folder is real, the
#     category has no lesson, so nothing is declared and nothing is stubbed.
#   - nothing from the retired ordinal tree.
#   - every README.md, metadata.yaml, images/, code/, notebooks/ and tools/ folder,
#     and every *.references.md companion — teaching assets and repo-facing
#     catalogues, not lessons with a nav entry.
#   - llms-applications-and-agents/agentic-ai/overview.md and
#     llms-applications-and-agents/rag-and-knowledge-systems/overview.md (T-203.5).
#     These are the SAME catalogue class as the README.md clause above — they were
#     `15. RAG_and_LLM_Applications/README.md` and `16. Agentic_AI/README.md` until
#     the P2 move renamed them, and the rename is the only reason the clause did
#     not already cover them. Naming them here closes that gap. Two reasons they
#     stay out: the nav already renders each family's ordered page list, so a
#     declared index would be a second, drifting ordering source; and the card-slug
#     layer projects BOTH files onto an `.../llms-applications-and-agents/overview/`
#     parent, disambiguating the second as `overview-2` — a generated collision
#     suffix is not a chartered URL to publish a nav page at. Their content was
#     repaired in the same pass (every file-path link is now a canonical frontend
#     URL, emoji left the headings) so what a reader reaching them sees is correct.
#   - foundations/mathematical-foundations/maths-for-ai-ml/linear-algebra/
#     vectorsandmatrices.md is GONE, not excluded (T-203.5): a 1-byte empty file
#     that eight *.references.md companions linked to as "Prereq math". Deleted,
#     and all eight corrected to the declared vectors-and-vector-spaces and
#     matrices-and-matrix-operations pages by canonical URL. No redirect.
apiVersion: estate/v2
kind: Course

metadata:
  id: learning-resources
  title: AI/ML Learning Resources

spec:
  shape: course
  naming: kebab-case         # the T-86 tree strips every NN. ordinal prefix
  idPattern: path            # `09-llms/kv-cache` — this tab's live id grammar

  # Declared, not hardcoded. This tree uses two levels: the seven layered
  # sections, and the three core-machine-learning middle folders nested inside
  # theirs. v1 capped nesting at one level inside the validator; the number now
  # states the shape the tab actually has.
  maxDepth: 2

  # The per-tab half of the frontmatter contract. Every lesson declares the
  # sub-area folder it lives in as its `category` — that is the dimension all
  # seven sections group by.
  pageProfile:
    required:
      - category

  # A `group_by` naming a key absent from here FAILS THE BUILD. That is what turns
  # "a facet with no backing field" from a silently empty filter into an error.
  facets:
    category:
      label: Category

